services:
    grp-speed-backend:
        build:
            context: .
            dockerfile: backend/Dockerfile
        image: garupa-speed-tracker-backend:local
        restart: unless-stopped
        env_file:
            - ./backend/.env
        environment:
            HOST: 0.0.0.0
            PORT: "5519"
            MONGODB_DB: garupa
        ports:
            - "5519:5519"
        volumes:
            - grp-speed-data:/app/data

volumes:
    grp-speed-data:
